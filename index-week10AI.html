<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHubユーザー情報表示ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-b from-sky-50 to-white">

    <main class="mx-auto max-w-4xl px-6 py-10">
        <h1 class="text-2xl font-bold mb-6">GitHubユーザー情報表示ツール</h1>

        <div class="flex gap-2 mb-4">
            <input id="usernameInput" type="text" placeholder="GitHubのユーザー名を入力"
                class="flex-1 border border-gray-300 rounded-md px-3 py-2">
            <button id="searchBtn"
                class="bg-blue-500 text-white px-4 py-2 rounded-md disabled:opacity-50">検索</button>
        </div>

        <p id="statusText" class="text-gray-500 mb-4"></p>

        <div id="resultArea" class="grid gap-4"></div>
    </main>

    <script>
        const usernameInput = document.querySelector("#usernameInput");
        const searchBtn = document.querySelector("#searchBtn");
        const statusText = document.querySelector("#statusText");
        const resultArea = document.querySelector("#resultArea");

        // リロード後も前回の結果を確認できるように、取得データをこのキーで保存する
        const STORAGE_KEY = "githubUserData";

        function renderUser(data) {
            resultArea.innerHTML = `
                <div class="bg-white rounded-md p-4 shadow max-w-sm">
                    <img src="${data.avatar_url}" alt="${data.login}のアバター画像" class="w-20 h-20 rounded-full mb-2">
                    <h2 class="font-bold text-xl">${data.name || "未設定"}</h2>
                    <p class="text-gray-500 mb-2">${data.bio || "未設定"}</p>
                    <p class="text-gray-500">フォロワー: ${data.followers}</p>
                    <p class="text-gray-500 mb-2">リポジトリ数: ${data.public_repos}</p>
                    <a href="${data.html_url}" target="_blank" rel="noopener" class="text-blue-500 underline">プロフィールページを見る</a>
                </div>
            `;
        }

        // ページ読み込み時、localStorageに前回分のデータがあれば復元する
        const cached = localStorage.getItem(STORAGE_KEY);
        if (cached) {
            const data = JSON.parse(cached);
            console.log("localStorageから復元したデータ:", data);
            usernameInput.value = data.login;
            renderUser(data);
        }

        searchBtn.addEventListener("click", async () => {
            const username = usernameInput.value.trim();
            if (!username) {
                statusText.textContent = "ユーザー名を入力してください";
                return;
            }

            searchBtn.disabled = true;
            resultArea.innerHTML = "";
            statusText.textContent = "読み込み中...";

            try {
                const response = await fetch(`https://api.github.com/users/${username}`);

                if (!response.ok) {
                    statusText.textContent = "ユーザーが見つかりませんでした";
                    return;
                }

                const data = await response.json();
                console.log("取得したユーザーデータ:", data);

                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

                statusText.textContent = "";
                renderUser(data);
            } catch (error) {
                console.error(error);
                statusText.textContent = "通信エラーが発生しました";
            } finally {
                searchBtn.disabled = false;
            }
        });
    </script>

</body>

</html>
