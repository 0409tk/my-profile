            <input type="number" id="weight" placeholder="例：65" class="border border-gray-300 rounded-md">
        </div>

        <button class="block bg-blue-600 text-white text-center font-bold rounded-md py-2 px-4 mx-auto mb-2"
            id="calc">計算する</button>
        <p class="font-bold text-xl mb-6 text-center" id="result"></p>

        // console.log(button);
                function judge(bmi) {
            if (bmi < 18.5) {
                return "やせ型";
            }
            else if (bmi < 25) {
                return "普通";
            }
            else  { return "肥満";

            }

        }


        const button = document.querySelector("#calc");
        // console.log(button);
        button.addEventListener("click", () => {
            let heightInput = document.querySelector("#height");
            // console.log(heightInput);
            let weightInput = document.querySelector("#weight");
            const result = document.querySelector("#result");


            let height = Number(heightInput.value);
            let heightM = height / 100;
            let weight = Number(weightInput.value);
            
            // console.log(weight);
            if (height <= 0 || weight <= 0) {
                result.textContent = "０以下の数値は計算できません";
            } else if (height === "" || weight === "") {
                result.textContent = "身長と体重を入力してください"
            } else {
            
            let bmi = weight / (heightM * heightM);
            let judgement = judge(bmi);
                result.textContent ="BMI" + bmi.toFixed(1) + "(" + judgement + ")";
            }


            // console.log(bmi);



        });

    </script>
