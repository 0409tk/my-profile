<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>week10</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-b from-sky-50 to-white">

    <main class="mx-auto max-w-4xl px-6 py-10">
        <h1 class="text-2xl font-bold mb-6">GitHubユーザー情報表示ツール</h1>

        <div class="flex gap-2 mb-8">
            <input id="usernameInput" type="text" placeholder="GitHubのユーザー名を入力"
                class="flex-1 border border-gray-300 rounded-md px-3 py-2">
            <button id="searchBtn" class="bg-blue-500 text-white px-4 py-2 rounded-md">検索</button>
        </div>

        <div id="memberCards" class="grid gap-4 sm:grid-cols-3">

        </div>
    </main>

    <script>
        // 1. input / button を取得する
        const username = document.querySelector("#usernameInput");
        const searchBtn = document.querySelector("#searchBtn");

        // 2. button がクリックされたら実行する関数
        //    fetch を await するので async をつけている
        searchBtn.addEventListener("click", async () => {

            try {
                const response = await fetch(`https://api.github.com/users/${username.value}`);

                // response.ok が false だった場合の分岐
                if (!response.ok) {
                    alert("ユーザーが見つかりませんでした");
                    return;
                }

                const data = await response.json();

                // TODO: data.avatar_url / data.name / data.bio / data.followers を使って
                // カードを作り、memberCards に差し込む（week8の lists() 関数と同じ考え方）
                const memberCards = document.querySelector("#memberCards");
                memberCards.innerHTML = "";
                const card = document.createElement("div");
                card.className = "bg-white rounded-md p-4 shadow";
                card.innerHTML = `
                    <img src="${data.avatar_url}" class="w-20 h-20 rounded-full mb-2">
                    <h2 class="font-bold text-xl">${data.name || "未設定"}</h2>
                    <p class="text-gray-500">${data.bio || "未設定"}</p>
                    <p class="text-gray-500">フォロワー: ${data.followers}</p>
                `;
                memberCards.appendChild(card);

            } catch (error) {
                // 通信自体が失敗した場合
                alert("通信エラーが発生しました");
            }
        });

    </script>

</body>

</html>
