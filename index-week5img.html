<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水総合研究所</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white">
    <!-- ヘッダー -->
    <header class="bg-white shadow top-0 left-0 z-[99] w-full fixed">
        <div class="flex p-4 justify-between items-center">
            <div class="flex gap-4 items-center">
                <p>💧</p>
                <h1 class="font-bold text-green-400">水分総合研究所</h1>
            </div>
            <nav class="text-sm md:text-base">
                <a href="#Home" class="hover:scale-105 transition mr-3">ホーム</a>
                <a href="#main" class="hover:scale-105 transition">商品</a>
            </nav>
        </div>
    </header>

    <!-- fixedヘッダーの被りを防ぐために pt-24 を追加 -->
    <main class="max-w-5xl mx-auto px-6 py-10 pt-24">

        <!-- ヒーローセクション（Home） -->
        <!-- スマホでは flex-col (縦並び)、PC(md:)で flex-row (横並び) -->
        <section class="p-6 rounded-md flex flex-col md:flex-row gap-8 md:gap-32 items-center" id="Home">
            <!-- スマホでは w-full (幅100%)、PC(md:)で w-1/2 (幅50%) -->
            <div class="w-full md:w-1/2 flex flex-col gap-6">
                <!-- スマホでは text-3xl、PC(md:)で text-5xl -->
                <h1 class="text-3xl md:text-5xl font-bold text-blue-800 mb-4 md:mb-8">
                    安くておいしい！<br>中大飲み物特集
                </h1>

                <p class="text-slate-600 mb-4">中央大学で購入することができる、<br class="hidden md:block">安くておいしい飲み物について紹介するサイトです。</p>

                <a href="https://c.gakuseizukan.jp/konetamap/chudai_tama_map_2024.pdf"
                    class="bg-emerald-600 text-white p-4 rounded-md text-center hover:bg-green-700 w-full md:w-auto">
                    キャンパスの地図を見る
                </a>
            </div>
            <div class="w-full md:w-1/2">
                <img src="./中央大学水.avif" alt="中央大学の水の写真" class="w-full h-auto rounded-md">
            </div>
        </section>

        <!-- 商品見出し -->
        <p class="font-bold text-2xl text-center mt-24 text-green-800 mb-12 md:mb-24 md:mt-48" id="main">おすすめの飲み物</p>

        <!-- おすすめ商品セクション -->
        <!-- スマホでは flex-col (縦並び)、PC(md:)で flex-row (横並び) -->
        <section class="flex flex-col md:flex-row gap-6 mx-4">

            <!-- スマホでは w-full (幅100%)、PC(md:)で w-1/3 (幅33%) -->
            <div
                class="flex flex-col w-full md:w-1/3 hover:shadow-md transition border border-slate-200 overflow-hidden rounded-md h-80">
                <img src="./chuo-tea.avif" alt="中大茶の写真" class="w-full h-1/2 object-cover">
                <div class="flex flex-col bg-green-200 flex-grow p-4">
                    <p class="font-bold text-green-600">中大茶</p>
                    <p class="text-black-300 my-1">120yen</p>
                    <p class="text-gray-600 text-sm">香ばしい茶葉の香り。通販での販売も行っています。</p>
                </div>
            </div>

            <div
                class="flex flex-col w-full md:w-1/3 hover:shadow-md transition border border-slate-200 overflow-hidden rounded-md h-80">
                <img src="./中央大学水.avif" alt="中大水の写真" class="w-full h-1/2 object-cover">
                <div class="flex flex-col bg-green-200 flex-grow p-4">
                    <p class="font-bold text-green-600">中大水</p>
                    <p class="text-black-300 my-1">100yen</p>
                    <p class="text-gray-600 text-sm">中大生なら一度はお世話になるはず。自販機で購入可。</p>
                </div>
            </div>

            <div
                class="flex flex-col w-full md:w-1/3 hover:shadow-md transition border border-slate-200 overflow-hidden rounded-md h-80">
                <!-- typo: object-coatain -> object-cover に修正しています -->
                <img src="./jyasumin.jpg" alt="ジャスミン茶の写真" class="w-full h-1/2 object-cover">
                <div class="flex flex-col bg-green-200 flex-grow p-4">
                    <p class="font-bold text-green-600">ジャスミン茶</p>
                    <p class="text-black-300 my-1">100yen</p>
                    <p class="text-gray-600 text-sm">豊かなジャスミンの香りにすっきりとしたのどごし。</p>
                </div>
            </div>

        </section>

    </main>

</body>

</html>
