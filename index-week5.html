<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水総合研究所</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white">
  <header class="bg-white shadow top-0 left-0 z-[99] w-full fixed">
    <div class="flex p-4 justify-between">
      <div class="flex gap-4">
        <p>💧</p>
        <h1 class="font-bold text-green-400">水分総合研究所</h1>
      </div>
      <nav>
        <a href="#Home" class="hover:scale-105 transition mr-3">ホーム</a>
        <a href="#main" class="hover:scale-105 transition">商品</a>
      </nav>
    </div>

  </header>

  <main class="max-w-5xl mx-auto px-6 py-10 ">


    <section class="p-6 rounded-md flex flex-row gap-32 items-center" id="Home">
      <div class="w-1/2 flex flex-col gap-6">
        <h1 class="text-5xl font-bold text-blue-800 mb-8">安くておいしい！
          <br>中大飲み物特集
        </h1>

        <p class="text-slate-600 mb-4">中央大学で購入することができる,
          安くておいしい飲み物について紹介するサイトです。</p>

        <a href="https://c.gakuseizukan.jp/konetamap/chudai_tama_map_2024.pdf"
          class=" bg-emerald-600 text-white p-4 rounded-md text-center hover:bg-green-700">
          キャンパスの地図を見る
        </a>
      </div>
      <div class="w-1/2">
        <img src="./中央大学水.avif" alt="中央大学の水の写真" class="w-full h-auto rounded-md">
      </div>
    </section>


    <p class="font-bold text-2xl text-center mt-24 text-green-800 mb-24 mt-48" id="main">おすすめの飲み物</p>


    <section class="flex gap-6 mx-4">

      <div
        class="flex flex-col w-1/3 hover:shadow-md transition border border-slate-200 overflow-hidden rounded-md h-80">
        <img src="./chuo-tea.avif" alt="中大茶の写真" class="w-full h-1/2 object-fill">
        <div class="flex flex-col bg-green-200 flex-grow p-4">
          <p class="font-bold text-green-600">中大茶</p>
          <p class="text-black-300 my-1">120yen</p>
          <p class="text-gray-600">香ばしい茶葉の香り。通販での販売も行っています。</p>
        </div>
      </div>

      <div
        class="flex flex-col w-1/3 hover:shadow-md transition border border-slate-200 overflow-hidden rounded-md h-80">
        <img src="./中央大学水.avif" alt="中大水の写真" class="w-full h-1/2 object-fill">
        <div class="flex flex-col bg-green-200 flex-grow p-4">
          <p class="font-bold text-green-600">中大水</p>
          <p class="text-black-300 my-1">100yen</p>
          <p class="text-gray-600">中大生なら一度はお世話になるはず。自販機で購入可。</p>
        </div>
      </div>

      <div
        class="flex flex-col w-1/3 hover:shadow-md transition border border-slate-200over overflow-hidden rounded-md h-80">
        <img src="./jyasumin.jpg" alt="ジャスミン茶の写真" class="w-full h-1/2 object-coatain">
        <div class="flex flex-col bg-green-200 flex-grow p-4">
          <p class="font-bold text-green-600">ジャスミン茶</p>
          <p class="text-black-300 my-1">100yen</p>
          <p class="text-gray-600">豊かなジャスミンの香りにすっきりとしたのどごし。</p>
        </div>
      </div>


    </section>

  </main>

</body>

</html>
